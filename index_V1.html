/* ============================================================================
   Qiyam al-Layl — Night Prayer Planner
   Self-contained React component. No external libraries, no storage, no build
   config required. Only peer dependency is React. Drop into any React project.

   Calculation: pure-JS solar algorithm (PrayTimes-style). The night runs from
   Maghrib (sunset) to Fajr. Fajr uses an 18° depression by default; during
   high-latitude "white nights" (when the sun never reaches the Fajr depression)
   it falls back to an angle-based rule — tuned to ~13° inside Sweden so the
   result tracks the Islamiska Förbundet times, and the standard 18° elsewhere.

   "Recommended"  = start of the last third of the night (classical guidance).
   "Optimistic"   = Fajr minus 45 minutes — a PERSONAL practical method, not a
                    fiqh ruling. Clearly disclaimed in the UI.
   ========================================================================== */

/* ----------------------------- solar math --------------------------------- */
const dtr = (d) => (d * Math.PI) / 180;
const rtd = (r) => (r * 180) / Math.PI;
const sin = (d) => Math.sin(dtr(d));
const cos = (d) => Math.cos(dtr(d));
const arcsin = (x) => rtd(Math.asin(x));
const arccos = (x) => rtd(Math.acos(x));
const arctan2 = (y, x) => rtd(Math.atan2(y, x));
const fixAngle = (a) => { a = a - 360 * Math.floor(a / 360); return a < 0 ? a + 360 : a; };
const fixHour = (a) => { a = a - 24 * Math.floor(a / 24); return a < 0 ? a + 24 : a; };

function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}

function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D);
  const q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * sin(g) + 0.02 * sin(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = arctan2(cos(e) * sin(L), cos(L)) / 15;
  const decl = arcsin(sin(e) * sin(L));
  const EqT = q / 15 - fixHour(RA);
  return { decl, EqT };
}

// Returns absolute local clock hours (can exceed 24 when noted) or NaN.
function makeDay(lat, lng, tz, y, m, d) {
  const jDate = julian(y, m, d) - lng / (15 * 24);
  const midDay = (t) => { const eqt = sunPosition(jDate + t).EqT; return fixHour(12 - eqt); };
  const sunAngleTime = (angle, t, dir) => {
    const decl = sunPosition(jDate + t).decl;
    const noon = midDay(t);
    const x = (-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat));
    if (x < -1 || x > 1) return NaN;
    const T = (1 / 15) * arccos(x);
    return noon + (dir === "ccw" ? -T : T);
  };
  const adj = (t) => (isNaN(t) ? NaN : t + tz - lng / 15);
  return {
    sunrise: adj(sunAngleTime(0.833, 6 / 24, "ccw")),
    sunset: adj(sunAngleTime(0.833, 18 / 24)),
  };
}

// Sweden bounding box (coarse, offline) — selects the ~13° IFiS-faithful tuning.
function isInSweden(lat, lng) {
  return lat >= 55.0 && lat <= 69.1 && lng >= 10.9 && lng <= 24.2;
}

/* Compute the night (Maghrib -> Fajr) for the evening of calendar date {y,m,d}.
   tzForDate returns the local UTC offset (hours) for a given date. */
function computeNight(lat, lng, tzForDate, y, m, d, fajrAngle) {
  const tz0 = tzForDate(y, m, d);
  const today = makeDay(lat, lng, tz0, y, m, d);
  const next = new Date(Date.UTC(y, m - 1, d + 1));
  const ny = next.getUTCFullYear(), nm = next.getUTCMonth() + 1, nd = next.getUTCDate();
  const tz1 = tzForDate(ny, nm, nd);
  const tomorrow = makeDay(lat, lng, tz1, ny, nm, nd);

  const sunset = today.sunset;            // Maghrib (same-day clock)
  let sunriseNext = tomorrow.sunrise;     // next-day clock (+24 for continuity)

  if (isNaN(sunset) || isNaN(sunriseNext)) {
    return { polar: true };               // no true sunset/sunrise (polar day/night)
  }
  const maghrib = sunset;
  const sunriseAbs = sunriseNext + 24;
  const nightAstro = sunriseAbs - maghrib;        // sunset -> sunrise, hours

  // Try a "true" Fajr at the requested depression on the next morning.
  const tdNext = makeDay(lat, lng, tz1, ny, nm, nd);
  void tdNext;
  // Recreate sunAngleTime for next morning Fajr at depression `fajrAngle`:
  const jD = julian(ny, nm, nd) - lng / (15 * 24);
  const decl = sunPosition(jD + 5 / 24).decl;
  const midday = fixHour(12 - sunPosition(jD + 5 / 24).EqT);
  const xx = (-sin(fajrAngle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat));
  let fajr;
  let highLat = false;
  if (xx >= -1 && xx <= 1) {
    const T = (1 / 15) * arccos(xx);
    fajr = (midday - T) + tz1 - lng / 15 + 24;    // next-day absolute clock
    // Guard: if it lands implausibly close to/after sunrise, treat as high-lat.
    if (fajr >= sunriseAbs) highLat = true;
  } else {
    highLat = true;
  }

  if (highLat) {
    const tunedAngle = isInSweden(lat, lng) ? 13 : fajrAngle; // 18° default elsewhere
    fajr = sunriseAbs - (tunedAngle / 60) * nightAstro;
  }

  const nightLen = fajr - maghrib;                // Qiyam night, hours
  const phase = (f) => maghrib + nightLen * f;

  return {
    polar: false,
    highLat,
    maghrib,
    fajr,
    sunriseAbs,
    nightLen,
    sixth1: phase(1 / 6),
    third1: phase(1 / 3),
    half: phase(1 / 2),
    lastThird: phase(2 / 3),   // Recommended
    lastSixth: phase(5 / 6),
    optimistic: fajr - 45 / 60, // Fajr − 45 min
  };
}

/* Qibla bearing from a point to the Kaaba (great-circle initial bearing). */
function qiblaBearing(lat, lng) {
  const KLAT = 21.4225, KLNG = 39.8262;
  const dL = KLNG - lng;
  const y = sin(dL) * cos(KLAT);
  const x = cos(lat) * sin(KLAT) - sin(lat) * cos(KLAT) * cos(dL);
  return (arctan2(y, x) + 360) % 360;
}

/* Tabular Islamic (civil) calendar — approximate Hijri date. */
function gregToHijri(gy, gm, gd) {
  let jd;
  if (gy > 1582 || (gy === 1582 && (gm > 10 || (gm === 10 && gd >= 15)))) {
    jd = Math.floor((1461 * (gy + 4800 + Math.floor((gm - 14) / 12))) / 4) +
      Math.floor((367 * (gm - 2 - 12 * Math.floor((gm - 14) / 12))) / 12) -
      Math.floor((3 * Math.floor((gy + 4900 + Math.floor((gm - 14) / 12)) / 100)) / 4) +
      gd - 32075;
  } else {
    jd = 367 * gy - Math.floor((7 * (gy + 5001 + Math.floor((gm - 9) / 7))) / 4) +
      Math.floor((275 * gm) / 9) + gd + 1729777;
  }
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
    Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
    Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const m = Math.floor((24 * l) / 709);
  const d = l - Math.floor((709 * m) / 24);
  const y = 30 * n + j - 30;
  return { y, m, d };
}
const HIJRI_MONTHS = ["Muḥarram", "Ṣafar", "Rabīʿ al-Awwal", "Rabīʿ al-Thānī",
  "Jumādā al-Ūlā", "Jumādā al-Thāniyah", "Rajab", "Shaʿbān", "Ramaḍān",
  "Shawwāl", "Dhū al-Qaʿdah", "Dhū al-Ḥijjah"];

/* ------------------------------ helpers ----------------------------------- */
const fmtTime = (h) => {
  if (h == null || isNaN(h)) return "—";
  h = fixHour(h);
  let m = Math.floor(h);
  let mm = Math.round((h - m) * 60);
  if (mm === 60) { mm = 0; m = (m + 1) % 24; }
  return `${String(m).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
};
const fmtDur = (mins) => {
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${String(m).padStart(2, "0")}m`;
};
const tzOffsetForDate = (y, m, d) => -new Date(y, m - 1, d, 12).getTimezoneOffset() / 60;

const CITIES = [
  { name: "Stockholm", lat: 59.3293, lng: 18.0686, tz: 2 },

const Ic = {

  close: (p) => (<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" {...p}><path d="M18 6 6 18M6 6l12 12" /></svg>),

/* --------------------------- the night dial ------------------------------- */
function NightDial({ night, nowFrac, theme }) {
  const R = 130, cx = 150, cy = 150, stroke = 7;
  const pt = (frac, r = R) => {
    const a = -90 + 360 * frac;
    return [cx + r * Math.cos(dtr(a)), cy + r * Math.sin(dtr(a))];
  };
  const arc = (f0, f1, r = R) => {
    const [x0, y0] = pt(f0, r), [x1, y1] = pt(f1, r);
    const large = f1 - f0 > 0.5 ? 1 : 0;
    return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
  };
  const optFrac = night ? 1 - (45 / 60) / night.nightLen : 0;
  const ticks = [
    { f: 1 / 6 }, { f: 1 / 3 }, { f: 1 / 2 }, { f: 2 / 3 }, { f: 5 / 6 },
  ];
  return (
    <svg viewBox="0 0 300 300" width="100%" style={{ maxWidth: 320, display: "block", margin: "0 auto" }}>
      <defs>
        <linearGradient id="nightGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="var(--dusk)" />
          <stop offset="50%" stopColor="var(--deepnight)" />
          <stop offset="100%" stopColor="var(--dawn)" />
        </linearGradient>
      </defs>
      {/* base night ring */}
      <circle cx={cx} cy={cy} r={R} fill="none" stroke="url(#nightGrad)" strokeWidth={stroke} strokeLinecap="round" opacity="0.85" />
      {/* recommended: last third */}
      <path d={arc(2 / 3, 0.999, R)} fill="none" stroke="var(--indigo)" strokeWidth={stroke + 3} strokeLinecap="round" opacity="0.95" />
      {/* optimistic window (inner) */}
      <path d={arc(optFrac, 0.999, R - 13)} fill="none" stroke="var(--amber)" strokeWidth={5} strokeLinecap="round" />
      {/* phase ticks */}
      {ticks.map((t, i) => {
        const [xo, yo] = pt(t.f, R + 9), [xi, yi] = pt(t.f, R - 9);
        return <line key={i} x1={xi} y1={yi} x2={xo} y2={yo} stroke="var(--line-strong)" strokeWidth="1.2" />;
      })}
      {/* Maghrib / Fajr marker at top */}
      <circle cx={pt(0)[0]} cy={pt(0)[1]} r="4.5" fill="var(--bg-elev)" stroke="var(--ink)" strokeWidth="1.5" />
      {/* now hand */}
      {nowFrac != null && nowFrac >= 0 && nowFrac <= 1 && (
        <g>
          <line x1={cx} y1={cy} x2={pt(nowFrac, R - 4)[0]} y2={pt(nowFrac, R - 4)[1]}
            stroke="var(--ink)" strokeWidth="2" strokeLinecap="round" opacity="0.55" />
          <circle cx={pt(nowFrac, R - 4)[0]} cy={pt(nowFrac, R - 4)[1]} r="5" fill="var(--ink)" />
        </g>
      )}
      <circle cx={cx} cy={cy} r="3" fill="var(--muted)" />
      {/* small labels */}
      <text x={cx} y={18} textAnchor="middle" className="dialLbl">Maghrib · Fajr</text>
      <text x={pt(2 / 3, R + 26)[0]} y={pt(2 / 3, R + 26)[1]} textAnchor="middle" className="dialLbl" dominantBaseline="middle">⅓</text>
      <text x={pt(1 / 2, R + 24)[0]} y={pt(1 / 2, R + 24)[1]} textAnchor="middle" className="dialLbl" dominantBaseline="middle">½</text>
    </svg>
  );
}

/* ------------------------------ tooltip/popover --------------------------- */
function InfoDot({ label, children, openId, setOpenId, id }) {
  const open = openId === id;
  return (
    <span style={{ position: "relative", display: "inline-flex" }}>
      <button className="infoBtn" aria-label={label}
        onClick={(e) => { e.stopPropagation(); setOpenId(open ? null : id); }}>
        <Ic.info />
      </button>
      {open && (
        <span className="popover" onClick={(e) => e.stopPropagation()}>
          {children}
        </span>
      )}
    </span>
  );
}

/* ================================ APP ===================================== */
function QiyamPlanner() {
  const [theme, setTheme] = useState("light");
  const [now, setNow] = useState(new Date());
  const [coords, setCoords] = useState(null);          // {lat,lng}
  const [label, setLabel] = useState("");
  const [locState, setLocState] = useState("detecting"); // detecting|ok|denied|manual
  const [selDate, setSelDate] = useState(null);          // Date or null = auto
  const [fajrAngle, setFajrAngle] = useState(18);
  const [showAdv, setShowAdv] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [heading, setHeading] = useState(null);          // device compass
  const [compassOn, setCompassOn] = useState(false);
  const [alarmMsg, setAlarmMsg] = useState("");
  const [manualLat, setManualLat] = useState("");
  const [manualLng, setManualLng] = useState("");

  /* tick */
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  /* close popovers on outside click */
  useEffect(() => {
    const h = () => setOpenId(null);
    window.addEventListener("click", h);
    return () => window.removeEventListener("click", h);
  }, []);

  /* geolocation -> IP fallback -> manual */
  useEffect(() => {
    let done = false;
    const useIP = () => {
      fetch("https://ipapi.co/json/")
        .then((r) => r.json())
        .then((j) => {
          if (done) return;
          if (j && j.latitude != null) {
            setCoords({ lat: j.latitude, lng: j.longitude });
            setLabel(j.city ? `${j.city}${j.country_name ? ", " + j.country_name : ""}` : "Approx. location");
            setLocState("ok");
          } else setLocState("manual");
        })
        .catch(() => { if (!done) setLocState("manual"); });
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (done) return;
          done = true;
          setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          setLabel("Your location");
          setLocState("ok");
        },
        () => { useIP(); },
        { timeout: 8000, maximumAge: 600000 }
      );
      // fallback if permission prompt is ignored
      setTimeout(() => { if (!coords && !done) useIP(); }, 9000);
    } else useIP();
    return () => { done = true; };
    // eslint-disable-next-line
  }, []);

  /* compass */
  const enableCompass = useCallback(() => {
    const handler = (e) => {
      let h = null;
      if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
      else if (e.alpha != null) h = 360 - e.alpha;
      if (h != null) setHeading(h);
    };
    const start = () => {
      window.addEventListener("deviceorientationabsolute", handler, true);
      window.addEventListener("deviceorientation", handler, true);
      setCompassOn(true);
    };
    const DOE = typeof DeviceOrientationEvent !== "undefined" ? DeviceOrientationEvent : null;
    if (DOE && typeof DOE.requestPermission === "function") {
      DOE.requestPermission().then((s) => { if (s === "granted") start(); }).catch(() => {});
    } else start();
  }, []);

  /* which night to show */
  const view = useMemo(() => {
    if (!coords) return null;
    const { lat, lng } = coords;
    const base = selDate || now;
    // For the live/auto view, pick the night whose Fajr is still ahead of "now".
    const tryDate = (offset) => {
      const dd = new Date(base.getFullYear(), base.getMonth(), base.getDate() + offset);
      return computeNight(lat, lng, tzOffsetForDate, dd.getFullYear(), dd.getMonth() + 1, dd.getDate(), fajrAngle);
    };
    let dateUsed = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    let n = computeNight(lat, lng, tzOffsetForDate, dateUsed.getFullYear(), dateUsed.getMonth() + 1, dateUsed.getDate(), fajrAngle);
    if (!selDate && !n.polar) {
      // hours since local midnight of "today"
      const hNow = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      // if we're before this morning's fajr, the active night began yesterday
      const yesterday = tryDate(-1);
      if (!yesterday.polar && hNow < fixHour(yesterday.fajr)) {
        n = yesterday;
        dateUsed = new Date(base.getFullYear(), base.getMonth(), base.getDate() - 1);
      }
    }
    return { n, dateUsed };
  }, [coords, selDate, now, fajrAngle]);

  const night = view && !view.n.polar ? view.n : null;

  /* current position within the night + next event */
  const live = useMemo(() => {
    if (!night) return null;
    const hNow = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    // unwrap "now" onto the same continuous axis as the night
    let cur = hNow;
    if (cur < night.maghrib - 0.001) cur += 24; // after midnight
    const frac = (cur - night.maghrib) / night.nightLen;
    const events = [
      { key: "Maghrib", t: night.maghrib },
      { key: "Last third (Recommended)", t: night.lastThird },
      { key: "Optimistic", t: night.optimistic },
      { key: "Fajr", t: night.fajr },
    ];
    let next = null;
    for (const e of events) { if (cur < e.t - 0.0005) { next = e; break; } }
    return { frac: frac >= 0 && frac <= 1 ? frac : null, next, cur };
  }, [night, now]);

  /* qibla */
  const qibla = coords ? qiblaBearing(coords.lat, coords.lng) : null;

  /* dates */
  const dispDate = view ? view.dateUsed : now;
  const hij = gregToHijri(dispDate.getFullYear(), dispDate.getMonth() + 1, dispDate.getDate());

  /* alarm / calendar */
  const planTahajjud = () => {
    if (!night) return;
    const d = view.dateUsed;
    // optimistic time may roll past midnight -> next calendar day
    const oh = fixHour(night.optimistic);
    const rollover = night.optimistic >= 24;
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (rollover ? 1 : 0),
      Math.floor(oh), Math.round((oh - Math.floor(oh)) * 60));
    const end = new Date(dt.getTime() + 45 * 60000);
    const pad = (x) => String(x).padStart(2, "0");
    const fmtICS = (x) => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    const ics = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//QiyamPlanner//EN",
      "BEGIN:VEVENT", `DTSTART:${fmtICS(dt)}`, `DTEND:${fmtICS(end)}`,
      "SUMMARY:Tahajjud / Qiyam al-Layl",
      "DESCRIPTION:Optimistic wake time (Fajr − 45 min). A personal practical method.",
      "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:Time for Qiyam al-Layl", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR",
    ].join("\r\n");
    try {
      const blob = new Blob([ics], { type: "text/calendar" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "tahajjud.ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setAlarmMsg(`Calendar reminder created for ${fmtTime(night.optimistic)}. If it didn’t download, set a phone alarm for ${fmtTime(night.optimistic)}.`);
    } catch {
      setAlarmMsg(`Set a phone alarm for ${fmtTime(night.optimistic)} to wake for Tahajjud.`);
    }
  };

  /* theme variables */
  const vars = theme === "light" ? {
    "--bg": "#F4F1E9", "--bg-elev": "#FBFAF4", "--ink": "#1C2030", "--muted": "#71748A",
    "--line": "rgba(28,32,48,0.10)", "--line-strong": "rgba(28,32,48,0.28)",
    "--indigo": "#2E3A66", "--indigo-soft": "rgba(46,58,102,0.10)",
    "--amber": "#B07D3B", "--amber-soft": "rgba(176,125,59,0.13)",
    "--dusk": "#6E76A8", "--deepnight": "#2E3A66", "--dawn": "#C8A35B",
    "--glow": "radial-gradient(120% 80% at 50% 115%, rgba(200,163,91,0.16), transparent 60%)",
  } : {
    "--bg": "#0E1320", "--bg-elev": "#161D2E", "--ink": "#ECE9DF", "--muted": "#8A90A6",
    "--line": "rgba(236,233,223,0.10)", "--line-strong": "rgba(236,233,223,0.30)",
    "--indigo": "#9AA9DE", "--indigo-soft": "rgba(154,169,222,0.12)",
    "--amber": "#D9B477", "--amber-soft": "rgba(217,180,119,0.14)",
    "--dusk": "#3A436E", "--deepnight": "#6E78B4", "--dawn": "#D9B477",
    "--glow": "radial-gradient(120% 90% at 50% -10%, rgba(154,169,222,0.14), transparent 60%)",
  };

  const Row = ({ name, time, accent, info, children }) => (
    <div className="row" style={accent ? { borderColor: `var(--${accent})` } : null}>
      <div className="rowL">
        <span className="rowName" style={accent ? { color: `var(--${accent})` } : null}>{name}</span>
        {info}
        {children}
      </div>
      <span className="rowTime">{time}</span>
    </div>
  );

  return (
    <div style={vars} className="qp-root">
      <style>{CSS}</style>
      <div className="qp-wrap">
        {/* header */}
        <header className="hdr">
          <div>
            <h1>Qiyām al-Layl</h1>
            <p className="sub">Night-prayer planner</p>
          </div>
          <button className="iconBtn" onClick={() => setTheme(theme === "light" ? "dark" : "light")}
            aria-label="Toggle theme">
            {theme === "light" ? <Ic.moon /> : <Ic.sun />}
          </button>
        </header>

        {/* location + date */}
        <div className="metaRow">
          <span className="meta"><Ic.pin /> {label || (locState === "detecting" ? "Locating…" : "Set location")}</span>
          <span className="meta">
            <Ic.cal /> {dispDate.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}
            <span className="hij"> · {hij.d} {HIJRI_MONTHS[hij.m - 1]}</span>
          </span>
        </div>

        {/* polar / detecting / manual states */}
        {locState === "detecting" && !coords && <div className="notice">Finding your location…</div>}
        {view && view.n.polar && (
          <div className="notice">
            No true night occurs at this location on this date (midnight sun / polar night).
            Try a date outside midsummer, or a location further south.
          </div>
        )}

        {/* clock */}
        {night && (
          <section className="clockBlock">
            <div className="clockWrap">
              <NightDial night={night} nowFrac={live ? live.frac : null} theme={theme} />
              <div className="clockCenter">
                <div className="bigTime">{now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}</div>
                {live && live.next ? (
                  <div className="countdown">
                    {live.next.key} in <b>{fmtDur((live.next.t - live.cur) * 60)}</b>
                  </div>
                ) : (
                  <div className="countdown">This night has ended</div>
                )}
                {night.highLat && <div className="hlTag">white-night mode</div>}
              </div>
            </div>
          </section>
        )}

        {/* key times */}
        {night && (
          <section className="times">
            <Row name="Maghrib" time={fmtTime(night.maghrib)} />
            <Row name="Recommended" accent="indigo" time={fmtTime(night.lastThird)}
              info={<InfoDot id="rec" openId={openId} setOpenId={setOpenId} label="About recommended">
                <b>The last third of the night.</b> The classically recommended window for
                Qiyām — the time the Prophet ﷺ described as most beloved for standing in prayer.
                Begins {fmtTime(night.lastThird)} and runs to Fajr.
              </InfoDot>} />

            <div className="optCard">
              <div className="optHead">
                <div>
                  <div className="optTitle" style={{ color: "var(--amber)" }}>
                    Optimistic
                    <InfoDot id="opt" openId={openId} setOpenId={setOpenId} label="About optimistic">
                      <b>A personal practical method — not a fiqh ruling.</b> Wake 45 minutes
                      before Fajr, pray Tahajjud / Qiyām, then move straight into Fajr. In
                      short-night regions like Sweden the full last third can be very demanding,
                      so this offers an achievable window that still lands you in worship right
                      before dawn. Use it as a practical aid, not a religious standard.
                    </InfoDot>
                  </div>
                  <div className="optSub">45 minutes before Fajr · personal method</div>
                </div>
                <div className="optTime" style={{ color: "var(--amber)" }}>{fmtTime(night.optimistic)}</div>
              </div>
              <button className="planBtn" onClick={planTahajjud}>
                <Ic.bell /> Plan my Tahajjud
              </button>
              {alarmMsg && <div className="alarmMsg">{alarmMsg}</div>}
              <div className="disclaim">A personal practical method, not a fiqh ruling.</div>
            </div>

            <Row name="Fajr" time={fmtTime(night.fajr)} />
            <div className="nlen">Night length · {fmtDur(night.nightLen * 60)}</div>
          </section>
        )}

        {/* qibla */}
        {coords && (
          <section className="qibla">
            <div className="qDial">
              <svg viewBox="0 0 110 110" width="92" height="92">
                <circle cx="55" cy="55" r="48" fill="none" stroke="var(--line)" strokeWidth="1.5" />
                <text x="55" y="15" textAnchor="middle" className="qN">N</text>
                <g style={{ transform: `rotate(${(qibla || 0) - (compassOn && heading != null ? heading : 0)}deg)`, transformOrigin: "55px 55px", transition: "transform .3s" }}>
                  <path d="M55 16 L61 58 L55 52 L49 58 Z" fill="var(--amber)" />
                  <line x1="55" y1="52" x2="55" y2="94" stroke="var(--line-strong)" strokeWidth="2" />
                </g>
                <circle cx="55" cy="55" r="3.5" fill="var(--ink)" />
              </svg>
            </div>
            <div className="qInfo">
              <div className="qLbl"><Ic.compass /> Qibla</div>
              <div className="qDeg">{qibla != null ? `${Math.round(qibla)}° from North` : "—"}</div>
              {!compassOn && (
                <button className="ghostBtn" onClick={enableCompass}>Enable live compass</button>
              )}
              {compassOn && heading == null && <div className="qHint">Move your phone to calibrate</div>}
              {!compassOn && <div className="qHint">Showing fixed bearing. Enable compass on a phone for a live needle.</div>}
            </div>
          </section>
        )}

        {/* advanced */}
        <button className="advToggle" onClick={() => setShowAdv(!showAdv)}>
          Settings & location <Ic.chev style={{ transform: showAdv ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
        </button>
        {showAdv && (
          <section className="adv">
            <label className="advRow">
              <span>Plan a date</span>
              <input type="date" className="inp"
                value={view ? `${view.dateUsed.getFullYear()}-${String(view.dateUsed.getMonth() + 1).padStart(2, "0")}-${String(view.dateUsed.getDate()).padStart(2, "0")}` : ""}
                onChange={(e) => {
                  if (!e.target.value) { setSelDate(null); return; }
                  const [yy, mm, dd] = e.target.value.split("-").map(Number);
                  setSelDate(new Date(yy, mm - 1, dd));
                }} />
            </label>
            {selDate && <button className="ghostBtn" onClick={() => setSelDate(null)}>Back to tonight</button>}

            <label className="advRow">
              <span>Fajr angle</span>
              <select className="inp" value={fajrAngle} onChange={(e) => setFajrAngle(Number(e.target.value))}>
                <option value={18}>18° (standard)</option>
                <option value={17}>17°</option>
                <option value={15}>15°</option>
                <option value={19.5}>19.5°</option>
              </select>
            </label>

            <label className="advRow">
              <span>City</span>
              <select className="inp" onChange={(e) => {
                const c = CITIES.find((x) => x.name === e.target.value);
                if (c) { setCoords({ lat: c.lat, lng: c.lng }); setLabel(c.name); setLocState("manual"); }
              }} defaultValue="">
                <option value="" disabled>Choose…</option>
                {CITIES.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}
              </select>
            </label>

            <div className="advRow">
              <span>Coordinates</span>
              <div style={{ display: "flex", gap: 6 }}>
                <input className="inp sm" placeholder="lat" value={manualLat} onChange={(e) => setManualLat(e.target.value)} />
                <input className="inp sm" placeholder="lng" value={manualLng} onChange={(e) => setManualLng(e.target.value)} />
                <button className="ghostBtn sm" onClick={() => {
                  const la = parseFloat(manualLat), ln = parseFloat(manualLng);
                  if (!isNaN(la) && !isNaN(ln)) { setCoords({ lat: la, lng: ln }); setLabel("Custom location"); setLocState("manual"); }
                }}>Set</button>
              </div>
            </div>

            <p className="advNote">
              Night = Maghrib (sunset) → Fajr. Fajr uses an {fajrAngle}° depression; during
              high-latitude white nights it switches to an angle-based rule (tuned to ~13° in
              Sweden to track Islamiska Förbundet, 18° elsewhere). Hijri date is approximate.
            </p>
          </section>
        )}

        <footer className="ft">
          Times are computed locally on your device. The “Optimistic” suggestion is a personal
          practical method, offered as an aid — not a religious ruling.
        </footer>
      </div>
    </div>
  );
}

/* ------------------------------- styles ----------------------------------- */

  -webkit-font-smoothing:antialiased; position:relative; }

  display:flex; flex-direction:column; gap:18px; animation:fade .7s ease both; }

.sub{ margin:4px 0 0; color:var(--muted); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; }
.iconBtn{ background:var(--bg-elev); color:var(--ink); border:1px solid var(--line);
  width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  transition:transform .15s, border-color .15s; }
.iconBtn:hover{ transform:translateY(-1px); border-color:var(--line-strong); }
.metaRow{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:13px; }
.meta{ display:inline-flex; align-items:center; gap:6px; }
.hij{ color:var(--muted); opacity:.85; }
.notice{ background:var(--bg-elev); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; font-size:13.5px; color:var(--muted); line-height:1.5; }
.clockBlock{ padding:6px 0 2px; }
.clockWrap{ position:relative; }
.clockCenter{ position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none; }

  font-size:46px; font-weight:600; line-height:1; letter-spacing:1px; }
.countdown{ margin-top:6px; font-size:12.5px; color:var(--muted); text-align:center; max-width:150px; }
.countdown b{ color:var(--ink); font-weight:600; }
.hlTag{ margin-top:8px; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--amber); border:1px solid var(--amber-soft); padding:2px 8px; border-radius:20px; background:var(--amber-soft); }
.dialLbl{ fill:var(--muted); font-size:10px; letter-spacing:.1em;
  font-family:'Avenir Next',system-ui,sans-serif; text-transform:uppercase; }
.times{ display:flex; flex-direction:column; gap:2px; }
.row{ display:flex; align-items:center; justify-content:space-between;
  padding:13px 4px; border-bottom:1px solid var(--line); }
.rowL{ display:flex; align-items:center; gap:7px; }
.rowName{ font-size:15px; }
.rowTime{ font-family:'Cormorant Garamond','Hoefler Text',Garamond,Georgia,serif;
  font-size:22px; font-weight:600; letter-spacing:.5px; }
.optCard{ background:var(--bg-elev); border:1px solid var(--amber-soft); border-radius:16px;
  padding:15px 16px; margin:8px 0; box-shadow:0 1px 0 var(--line); }
.optHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.optTitle{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }
.optSub{ font-size:11.5px; color:var(--muted); margin-top:3px; }
.optTime{ font-family:'Cormorant Garamond','Hoefler Text',Garamond,Georgia,serif;
  font-size:28px; font-weight:600; }
.planBtn{ margin-top:13px; width:100%; border:none; cursor:pointer; border-radius:11px;
  background:var(--indigo); color:#fff; padding:11px; font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s, opacity .15s; letter-spacing:.02em; }
.planBtn:hover{ transform:translateY(-1px); opacity:.94; }
.alarmMsg{ margin-top:10px; font-size:12px; color:var(--muted); line-height:1.45; }

  display:inline-flex; line-height:0; }
.infoBtn:hover{ color:var(--ink); }

  box-shadow:0 10px 30px rgba(0,0,0,.18); }
.popover b{ display:inline; }
.qibla{ display:flex; align-items:center; gap:16px; background:var(--bg-elev);
  border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
.qN{ fill:var(--muted); font-size:9px; font-family:'Avenir Next',system-ui,sans-serif; }
.qLbl{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
.qDeg{ font-family:'Cormorant Garamond',Georgia,serif; font-size:22px; font-weight:600; margin:2px 0 6px; }
.qHint{ font-size:11px; color:var(--muted); line-height:1.4; max-width:200px; }
.ghostBtn{ background:none; border:1px solid var(--line-strong); color:var(--ink);

  display:inline-flex; align-items:center; gap:6px; padding:4px 0; align-self:center; }
.adv{ display:flex; flex-direction:column; gap:12px; background:var(--bg-elev);
  border:1px solid var(--line); border-radius:16px; padding:16px; }
.advRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px; }

  border-radius:9px; padding:7px 9px; font-size:13px; font-family:inherit; }
.inp.sm{ width:64px; }
.advNote{ font-size:11.5px; color:var(--muted); line-height:1.55; margin:2px 0 0; }
.ft{ text-align:center; font-size:11px; color:var(--muted); line-height:1.55; max-width:330px;
  margin:6px auto 0; }
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<QiyamPlanner />);
</script>
</body>
</html>
